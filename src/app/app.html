<!-- Navbar siempre visible -->
<app-navbar
  (authRequested)="openAuth()"
  (homeRequested)="goHome()"
></app-navbar>


<!-- LOGIN / REGISTER -->
@if (showAuth) {

  <!-- authSuccess avisa cuando el usuario entra correctamente -->
  <app-auth
    (authSuccess)="handleAuthSuccess()"
  ></app-auth>

}


<!-- CHECKOUT -->
@else if (showCheckout) {

  <!-- Envía el plan seleccionado a Checkout -->
  <app-checkout
    [planName]="selectedPlanName"
    [planPrice]="selectedPlanPrice"
  ></app-checkout>

}


<!-- CREATE PROFILE -->
@else if (showOnboarding) {

  <app-onboarding></app-onboarding>

}


<!-- LANDING PAGE -->
@else {

  <app-hero
    (authRequested)="openAuth()"
  ></app-hero>

  <app-programs></app-programs>

  <!-- Recibe el plan seleccionado -->
  <app-membership
    (planSelected)="handlePlanSelected($event)"
  ></app-membership>

  <app-trainers></app-trainers>

  <app-how-it-works></app-how-it-works>

}
