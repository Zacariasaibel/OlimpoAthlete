<!-- Sección de autenticación -->
<section class="auth">

  <!-- Tarjeta principal -->
  <div class="auth-card">


    <!-- REGISTRO -->
    <form (ngSubmit)="register()">

      <p class="auth-label">
        CREATE ACCOUNT
      </p>

      <h2>
        Join OlimpoAthlete
      </h2>


      <!-- Campo nombre -->
      <div class="form-group">

        <label for="name">
          Name
        </label>

        <!-- ngModel conecta input ↔ variable name -->
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Your name"
          [(ngModel)]="name"
        >

      </div>


      <!-- Campo email -->
      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="email"
        >

      </div>


      <!-- Campo contraseña -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          [(ngModel)]="password"
        >

      </div>


      <!-- Ejecuta register() -->
      <button type="submit">
        CREATE ACCOUNT
      </button>


      <!-- Muestra mensaje si existe -->
      @if (registerMessage) {

        <p>
          {{ registerMessage }}
        </p>

      }

    </form>



    <!-- LOGIN -->
    <form
      class="login-section"
      (ngSubmit)="login()"
    >

      <p class="auth-label">
        LOGIN
      </p>

      <h2>
        Welcome back
      </h2>


      <!-- Email del login -->
      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          id="loginEmail"
          name="loginEmail"
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="loginEmail"
        >

      </div>


      <!-- Contraseña del login -->
      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          id="loginPassword"
          name="loginPassword"
          type="password"
          placeholder="Your password"
          [(ngModel)]="loginPassword"
        >

      </div>


      <!-- Ejecuta login() -->
      <button type="submit">
        LOGIN
      </button>


      <!-- Muestra resultado del login -->
      @if (loginMessage) {

        <p>
          {{ loginMessage }}
        </p>

      }

    </form>

  </div>

</section>
