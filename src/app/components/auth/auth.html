<section class="auth">

  <p class="demo-notice">Frontend demo: use fictional details and a made-up password. Data stays in this browser.</p>

  <div class="auth-card">
    <form (ngSubmit)="register()">

      <p class="auth-label">
        CREATE ACCOUNT
      </p>

      <h1>
        Join OlimpoAthlete
      </h1>

      <div class="form-group">

        <label for="name">
          Name
        </label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Your name"
          [(ngModel)]="name"
        >

      </div>

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="email"
        >

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          [(ngModel)]="password"
        >

      </div>

      <button type="submit">
        CREATE ACCOUNT
      </button>

      @if (registerMessage) {
        <p>
          {{ registerMessage }}
        </p>
      }

    </form>


    <form
      class="login-section"
      (ngSubmit)="login()"
    >

      <p class="auth-label">
        LOGIN
      </p>

      <h2>
        Welcome back
      </h2>

      <div class="form-group">

        <label for="loginEmail">
          Email
        </label>

        <input
          id="loginEmail"
          name="loginEmail"
          type="email"
          placeholder="you@example.com"
          [(ngModel)]="loginEmail"
        >

      </div>

      <div class="form-group">

        <label for="loginPassword">
          Password
        </label>

        <input
          id="loginPassword"
          name="loginPassword"
          type="password"
          placeholder="Your password"
          [(ngModel)]="loginPassword"
        >

      </div>

      <button type="submit">
        LOGIN
      </button>

      @if (loginMessage) {
        <p>
          {{ loginMessage }}
        </p>
      }

    </form>

  </div>

</section>
