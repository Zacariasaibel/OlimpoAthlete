<section
  class="trainers"
  id="coaches"
>

  <div class="trainers-header">

    <p class="trainers-label">
      AI COACHES
    </p>

    <h2>
      Meet your coaches
    </h2>

    <p class="trainers-description">
      Each AI Coach specializes in a different training goal.
      Choose yours after creating your account.
    </p>

  </div>


  <div class="trainers-list">

    @for (trainer of trainers; track trainer.name) {

      <article class="trainer-card">

        <h3>
          {{ trainer.name }}
        </h3>

        <p>
          {{ trainer.specialty }}
        </p>

      </article>

    }

  </div>

</section>
